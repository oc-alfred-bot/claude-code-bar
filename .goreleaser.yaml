version: 2

builds:
  - id: claude-code-bar
    binary: claude-code-bar
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w

universal_binaries:
  - id: claude-code-bar
    replace: true

archives:
  - id: default
    format: zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

brews:
  - name: claude-code-bar
    repository:
      owner: enlabs-org
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/enlabs-org/claude-code-bar"
    description: "macOS menu bar app showing Claude Code API usage"
    license: "MIT"
    install: |
      bin.install "claude-code-bar"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
